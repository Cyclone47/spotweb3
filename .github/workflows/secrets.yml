name: Secret scanning

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history with redacted output
        run: |
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" \
            --entrypoint /bin/sh ghcr.io/gitleaks/gitleaks:v8.30.1 -c \
            'git config --global --add safe.directory /repo && gitleaks git /repo --log-opts="--all" --redact=100 --no-banner'
